# NAVY ay Android app: end-to-end check on an Android emulator (phase 3A).
# Triggers: a tag navy-android-check-* (git tag navy-android-check-N && git push origin
# navy-android-check-N) or a manual run. Never pull_request. Uses NO secret: debug build (WebView debugging on) for the
# scripted checks, then the published signed APK (stable Releases address) for the
# install-and-start check. Script: navy-android/scripts/emulator-check.mjs.

name: NAVY ay Android check

on:
  push:
    tags:
      - 'navy-android-check-*'
  workflow_dispatch:
    inputs:
      api-level:
        description: 'Android API level of the emulator'
        required: true
        default: '30'

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: navy-android/package-lock.json

      - name: Build debug APK
        working-directory: navy-android
        run: |
          npm ci
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PnavyVersionName=0.0.0-check -PnavyVersionCode=1

      - name: Download published APK
        run: curl -sSfL -o navy-ay-release.apk https://github.com/${{ github.repository }}/releases/latest/download/navy-ay.apk || echo "No published APK yet"

      - name: Emulator checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api-level || '30' }}
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r navy-android/android/app/build/outputs/apk/debug/app-debug.apk
            node navy-android/scripts/emulator-check.mjs debug; echo "DEBUG_EXIT=$?" >> "$GITHUB_ENV"
            adb uninstall com.cyberkely.navyay || true
            if [ -f navy-ay-release.apk ]; then adb install navy-ay-release.apk && node navy-android/scripts/emulator-check.mjs release; echo "RELEASE_EXIT=$?" >> "$GITHUB_ENV"; fi

      - name: Result
        run: |
          echo "debug checks exit: ${DEBUG_EXIT:-missing}, release checks exit: ${RELEASE_EXIT:-skipped}"
          test "${DEBUG_EXIT:-1}" = "0"
          test "${RELEASE_EXIT:-0}" = "0"
