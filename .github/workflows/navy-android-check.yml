# NAVY ay Android app: end-to-end check on an Android emulator (phase 3A, 3B).
# Triggers: a tag navy-android-check-* (git tag navy-android-check-N && git push origin
# navy-android-check-N) or a manual run.
# Phase 3B: navy-android-build-N = compile only (Java errors as annotations);
# navy-android-oldwv-N = Android 11 image (WebView 83): the "update WebView" page.
# Phase 3C: navy-android-update-N = checks of the app's own updater (debug build with the
# versionCode of 1.1.0, then real Release files: address, SHA-256, version, certificate);
# navy-android-intent-N = "Ouvrir l'appli pour la mettre à jour" from Chrome, app present
# then absent (needs the site in production). Unit tests of the native rules run first. Never pull_request. Uses NO secret: debug build (WebView debugging on) for the
# scripted checks, then the published signed APK (stable Releases address) for the
# install-and-start check. Script: navy-android/scripts/emulator-check.mjs.

name: NAVY ay Android check

on:
  push:
    tags:
      - 'navy-android-check-*'
      - 'navy-android-build-*'
      - 'navy-android-oldwv-*'
      - 'navy-android-update-*'
      - 'navy-android-intent-*'
  workflow_dispatch:
    inputs:
      api-level:
        description: 'Android API level of the emulator'
        required: true
        default: '34'

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: navy-android/package-lock.json

      - name: Build debug APK
        working-directory: navy-android
        run: |
          npm ci
          npx cap sync android
          cd android
          chmod +x gradlew
          CODE=1
          case "$GITHUB_REF_NAME" in navy-android-update-*) CODE=10100 ;; esac
          set +e
          ./gradlew testDebugUnitTest assembleDebug --no-daemon -PnavyVersionName=0.0.0-check -PnavyVersionCode=$CODE > ../build.log 2>&1
          STATUS=$?
          set -e
          tail -40 ../build.log
          if [ $STATUS -ne 0 ]; then
            MSG=$(grep -E "error:|warning: \[|e: |What went wrong|> " ../build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Android build failed::$MSG"
            exit $STATUS
          fi
          echo "::notice title=Android build::debug APK built, unit tests passed (versionCode $CODE)"

      - name: Compile only
        if: startsWith(github.ref_name, 'navy-android-build-')
        run: echo "Compile-only run, no emulator"

      - name: Download published APK
        if: ${{ !startsWith(github.ref_name, 'navy-android-build-') }}
        run: curl -sSfL -o navy-ay-release.apk https://github.com/${{ github.repository }}/releases/latest/download/navy-ay.apk || echo "No published APK yet"

      - name: Update checks (phase 3C)
        if: startsWith(github.ref_name, 'navy-android-update-')
        uses: reactivecircus/android-emulator-runner@v2
        env:
          NAVY_NEWER_TAG: navy-android-v1.2.0
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r navy-android/android/app/build/outputs/apk/debug/app-debug.apk
            node navy-android/scripts/emulator-check.mjs update; echo "UPDATE_EXIT=$?" >> "$GITHUB_ENV"

      - name: Intent checks (phase 3C)
        if: startsWith(github.ref_name, 'navy-android-intent-')
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r navy-android/android/app/build/outputs/apk/debug/app-debug.apk
            node navy-android/scripts/emulator-check.mjs intent; echo "INTENT_EXIT=$?" >> "$GITHUB_ENV"

      - name: Emulator checks
        if: ${{ !startsWith(github.ref_name, 'navy-android-build-') && !startsWith(github.ref_name, 'navy-android-oldwv-') && !startsWith(github.ref_name, 'navy-android-update-') && !startsWith(github.ref_name, 'navy-android-intent-') }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api-level || '34' }}
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r navy-android/android/app/build/outputs/apk/debug/app-debug.apk
            node navy-android/scripts/emulator-check.mjs debug; echo "DEBUG_EXIT=$?" >> "$GITHUB_ENV"
            node navy-android/scripts/emulator-check.mjs native; echo "NATIVE_EXIT=$?" >> "$GITHUB_ENV"
            adb uninstall com.cyberkely.navyay || true
            if [ -f navy-ay-release.apk ]; then adb install navy-ay-release.apk && node navy-android/scripts/emulator-check.mjs release; echo "RELEASE_EXIT=$?" >> "$GITHUB_ENV"; fi

      - name: Old WebView check (Android 11, WebView 83)
        if: startsWith(github.ref_name, 'navy-android-oldwv-')
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r navy-android/android/app/build/outputs/apk/debug/app-debug.apk
            node navy-android/scripts/emulator-check.mjs oldwebview; echo "OLDWV_EXIT=$?" >> "$GITHUB_ENV"

      - name: Result
        if: ${{ !startsWith(github.ref_name, 'navy-android-build-') }}
        run: |
          echo "::notice title=NAVY check exits::debug=${DEBUG_EXIT:-skipped} native=${NATIVE_EXIT:-skipped} release=${RELEASE_EXIT:-skipped} oldwebview=${OLDWV_EXIT:-skipped} update=${UPDATE_EXIT:-skipped} intent=${INTENT_EXIT:-skipped}"
          if [ -n "${OLDWV_EXIT:-}" ]; then test "$OLDWV_EXIT" = "0"; exit $?; fi
          if [ -n "${UPDATE_EXIT:-}" ]; then test "$UPDATE_EXIT" = "0"; exit $?; fi
          if [ -n "${INTENT_EXIT:-}" ]; then test "$INTENT_EXIT" = "0"; exit $?; fi
          test "${DEBUG_EXIT:-1}" = "0" && test "${NATIVE_EXIT:-1}" = "0"
          test "${RELEASE_EXIT:-0}" = "0"
