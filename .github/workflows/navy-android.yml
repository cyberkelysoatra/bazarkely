# NAVY ay Android app: signed build + GitHub Release (phase 3A).
#
# Publish a new version (one command, from C:\bazarkely-2):
#   git tag navy-android-v1.0.1 && git push origin navy-android-v1.0.1
#
# Triggers: ONLY a tag navy-android-v* or a manual run (workflow_dispatch).
# Never pull_request / pull_request_target: the signing secrets must never reach
# code proposed by a third party (the repository is public, and so are these logs).
#
# Secrets (Settings > Secrets and variables > Actions), never printed:
#   NAVY_KEYSTORE_BASE64, NAVY_KEYSTORE_PASSWORD, NAVY_KEY_ALIAS, NAVY_KEY_PASSWORD
#   NAVY_GOOGLE_SERVICES_BASE64 (phase 3B: Firebase google-services.json, base64; decoded
#   into a temporary file removed after the build, never committed)
#
# A tag run publishes the Release "navy-ay.apk" (stable address:
# https://github.com/cyberkelysoatra/bazarkely/releases/latest/download/navy-ay.apk)
# then updates frontend/public/navy/app/version.json on the deployed branch.
# Phase 3C: version.json also carries version_code, sha256, size_bytes, apk_url (this
# version's own Release file, the only address the app's updater accepts), notes_fr (the
# annotated tag's message) and minimum_version (kept from the file). Publish with:
#   git tag -a navy-android-v1.2.1 -m "Ce qui change en une à trois lignes" && git push origin navy-android-v1.2.1
# A manual run only builds and keeps the APK as a run artifact (no Release).

name: NAVY ay Android

on:
  push:
    tags:
      - 'navy-android-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name for a test build (X.Y.Z), no Release'
        required: true
        default: '0.0.1'

permissions:
  contents: write

concurrency:
  group: navy-android
  cancel-in-progress: false

env:
  DEPLOY_BRANCH: cloudflare-migration

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Version from tag
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#navy-android-v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version '$VERSION' (expected X.Y.Z)"; exit 1
          fi
          IFS=. read -r MAJ MIN PAT <<< "$VERSION"
          if [ "$MIN" -gt 99 ] || [ "$PAT" -gt 99 ]; then
            echo "::error::Minor and patch must stay below 100 (versionCode = X*10000 + Y*100 + Z)"; exit 1
          fi
          CODE=$((MAJ * 10000 + MIN * 100 + PAT))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building NAVY ay $VERSION (versionCode $CODE)"

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Android SDK: preinstalled on GitHub's ubuntu runners (ANDROID_HOME).

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: navy-android/package-lock.json

      - name: Install Capacitor
        working-directory: navy-android
        run: npm ci

      - name: Capacitor sync
        working-directory: navy-android
        run: npx cap sync android

      - name: Decode signing key
        env:
          NAVY_KEYSTORE_BASE64: ${{ secrets.NAVY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$NAVY_KEYSTORE_BASE64" ]; then
            echo "::error::Secret NAVY_KEYSTORE_BASE64 is missing"; exit 1
          fi
          printf '%s' "$NAVY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/navy-ay.jks"
          echo "NAVY_KEYSTORE_PATH=$RUNNER_TEMP/navy-ay.jks" >> "$GITHUB_ENV"

      - name: Decode Firebase configuration
        env:
          NAVY_GOOGLE_SERVICES_BASE64: ${{ secrets.NAVY_GOOGLE_SERVICES_BASE64 }}
        run: |
          if [ -z "$NAVY_GOOGLE_SERVICES_BASE64" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "::error::Secret NAVY_GOOGLE_SERVICES_BASE64 is missing (notifications would not work)"; exit 1
            fi
            echo "::warning::No Firebase configuration: test build without notifications"; exit 0
          fi
          printf '%s' "$NAVY_GOOGLE_SERVICES_BASE64" | base64 -d > navy-android/android/app/google-services.json
          if ! grep -q '"package_name": *"com.cyberkely.navyay"' navy-android/android/app/google-services.json; then
            rm -f navy-android/android/app/google-services.json
            echo "::error::google-services.json does not declare com.cyberkely.navyay"; exit 1
          fi
          echo "Firebase configuration decoded (content not printed)"

      - name: Unit tests of the native rules (update checks)
        working-directory: navy-android/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon -PnavyVersionName="${{ steps.version.outputs.name }}" -PnavyVersionCode="${{ steps.version.outputs.code }}"

      - name: Build signed release APK
        working-directory: navy-android/android
        env:
          NAVY_KEYSTORE_PASSWORD: ${{ secrets.NAVY_KEYSTORE_PASSWORD }}
          NAVY_KEY_ALIAS: ${{ secrets.NAVY_KEY_ALIAS }}
          NAVY_KEY_PASSWORD: ${{ secrets.NAVY_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PnavyVersionName="${{ steps.version.outputs.name }}" \
            -PnavyVersionCode="${{ steps.version.outputs.code }}"

      - name: Remove signing key and Firebase configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/navy-ay.jks" navy-android/android/app/google-services.json

      - name: Check signature and version
        id: apk
        run: |
          APK=navy-android/android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::Unsigned or missing APK"; ls -R navy-android/android/app/build/outputs/apk; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          CERT=$("$BT/apksigner" verify --verbose --print-certs "$APK" | grep -E "Verified using|Signer #1 certificate (DN|SHA-256|SHA-1)")
          echo "$CERT"
          # Public fingerprints (needed to restrict the Firebase API key to this app).
          echo "::notice title=APK certificate::$(echo "$CERT" | grep -E "SHA-256|SHA-1" | paste -sd ' ')"
          "$BT/aapt2" dump badging "$APK" | head -1
          cp "$APK" navy-ay.apk
          SIZE=$(stat -c %s navy-ay.apk)
          SHA256=$(sha256sum navy-ay.apk | cut -d' ' -f1)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "::notice title=APK SHA-256::$SHA256"
          echo "APK size: $SIZE bytes"

      - name: Keep APK (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: navy-ay-${{ steps.version.outputs.name }}
          path: navy-ay.apk
          retention-days: 7

      # Phase 3C: "Ce qui change" (notes_fr) = the message of the annotated tag, 1 to 3
      # lines of plain French: git tag -a navy-android-vX.Y.Z -m "..."
      - name: Release notes from the tag annotation
        id: notes
        if: github.event_name == 'push'
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          TEXT=""
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag" ]; then
            TEXT=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/-----BEGIN/,$d' | grep -v '^[[:space:]]*$' | head -3 | cut -c1-200)
          fi
          if [ -z "$TEXT" ]; then TEXT="Améliorations et corrections."; fi
          {
            echo "text<<NAVY_NOTES_EOF"
            echo "$TEXT"
            echo "NAVY_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=notes_fr::$(echo "$TEXT" | paste -sd ' ')"

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
          NOTES_FR: ${{ steps.notes.outputs.text }}
        run: |
          {
            echo "Appli Android NAVY ay, version $VERSION."
            echo ""
            echo "Ce qui change :"
            echo "$NOTES_FR"
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" navy-ay.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "NAVY ay Android $VERSION" \
            --notes-file release-notes.md \
            --latest

      - name: Update version.json on the site
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
          SIZE: ${{ steps.apk.outputs.size }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
          NOTES_FR: ${{ steps.notes.outputs.text }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "$DEPLOY_BRANCH"
            git checkout -B "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
            FILE=frontend/public/navy/app/version.json
            # minimum_version is kept from the file (changed by hand in the repository only
            # when an old app must be blocked); 1.0.0 = nobody is blocked.
            MIN=$(jq -r '.minimum_version // "1.0.0"' "$FILE" 2>/dev/null || echo "1.0.0")
            echo "$MIN" | grep -Eq '^[0-9]+[.][0-9]+[.][0-9]+$' || MIN="1.0.0"
            jq -n --arg version "$VERSION" \
              --arg latest "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/navy-ay.apk" \
              --arg apk "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/navy-ay.apk" \
              --arg sha "$SHA256" --arg notes "$NOTES_FR" --arg min "$MIN" \
              --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --argjson code "$CODE" --argjson size "$SIZE" \
              '{version: $version, apkUrl: $latest, apkSizeBytes: $size, publishedAt: $at,
                version_code: $code, sha256: $sha, size_bytes: $size, apk_url: $apk,
                notes_fr: $notes, minimum_version: $min}' > "$FILE"
            cat "$FILE"
            git add -f "$FILE"
            git commit -m "chore: NAVY ay Android app $VERSION published"
            if git push origin "$DEPLOY_BRANCH"; then exit 0; fi
            echo "Push rejected, retrying ($attempt)"
            sleep 5
          done
          exit 1
