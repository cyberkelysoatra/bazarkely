# NAVY ay Android app: signed build + GitHub Release (phase 3A).
#
# Publish a new version (one command, from C:\bazarkely-2):
#   git tag navy-android-v1.0.1 && git push origin navy-android-v1.0.1
#
# Triggers: ONLY a tag navy-android-v* or a manual run (workflow_dispatch).
# Never pull_request / pull_request_target: the signing secrets must never reach
# code proposed by a third party (the repository is public, and so are these logs).
#
# Secrets (Settings > Secrets and variables > Actions), never printed:
#   NAVY_KEYSTORE_BASE64, NAVY_KEYSTORE_PASSWORD, NAVY_KEY_ALIAS, NAVY_KEY_PASSWORD
#
# A tag run publishes the Release "navy-ay.apk" (stable address:
# https://github.com/cyberkelysoatra/bazarkely/releases/latest/download/navy-ay.apk)
# then updates frontend/public/navy/app/version.json on the deployed branch.
# A manual run only builds and keeps the APK as a run artifact (no Release).

name: NAVY ay Android

on:
  push:
    tags:
      - 'navy-android-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name for a test build (X.Y.Z), no Release'
        required: true
        default: '0.0.1'

permissions:
  contents: write

concurrency:
  group: navy-android
  cancel-in-progress: false

env:
  DEPLOY_BRANCH: cloudflare-migration

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version from tag
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#navy-android-v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version '$VERSION' (expected X.Y.Z)"; exit 1
          fi
          IFS=. read -r MAJ MIN PAT <<< "$VERSION"
          if [ "$MIN" -gt 99 ] || [ "$PAT" -gt 99 ]; then
            echo "::error::Minor and patch must stay below 100 (versionCode = X*10000 + Y*100 + Z)"; exit 1
          fi
          CODE=$((MAJ * 10000 + MIN * 100 + PAT))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building NAVY ay $VERSION (versionCode $CODE)"

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: navy-android/package-lock.json

      - name: Install Capacitor
        working-directory: navy-android
        run: npm ci

      - name: Capacitor sync
        working-directory: navy-android
        run: npx cap sync android

      - name: Decode signing key
        env:
          NAVY_KEYSTORE_BASE64: ${{ secrets.NAVY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$NAVY_KEYSTORE_BASE64" ]; then
            echo "::error::Secret NAVY_KEYSTORE_BASE64 is missing"; exit 1
          fi
          printf '%s' "$NAVY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/navy-ay.jks"
          echo "NAVY_KEYSTORE_PATH=$RUNNER_TEMP/navy-ay.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: navy-android/android
        env:
          NAVY_KEYSTORE_PASSWORD: ${{ secrets.NAVY_KEYSTORE_PASSWORD }}
          NAVY_KEY_ALIAS: ${{ secrets.NAVY_KEY_ALIAS }}
          NAVY_KEY_PASSWORD: ${{ secrets.NAVY_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PnavyVersionName="${{ steps.version.outputs.name }}" \
            -PnavyVersionCode="${{ steps.version.outputs.code }}"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/navy-ay.jks"

      - name: Check signature and version
        id: apk
        run: |
          APK=navy-android/android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::Unsigned or missing APK"; ls -R navy-android/android/app/build/outputs/apk; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | grep -E "Verified using|Signer #1 certificate (DN|SHA-256)"
          "$BT/aapt2" dump badging "$APK" | head -1
          cp "$APK" navy-ay.apk
          SIZE=$(stat -c %s navy-ay.apk)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "APK size: $SIZE bytes"

      - name: Keep APK (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: navy-ay-${{ steps.version.outputs.name }}
          path: navy-ay.apk
          retention-days: 7

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          gh release create "$GITHUB_REF_NAME" navy-ay.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "NAVY ay Android $VERSION" \
            --notes "Appli Android NAVY ay, version $VERSION. Page d'installation : https://1sakely.org/navy/app" \
            --latest

      - name: Update version.json on the site
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.name }}
          SIZE: ${{ steps.apk.outputs.size }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "$DEPLOY_BRANCH"
            git checkout -B "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
            FILE=frontend/public/navy/app/version.json
            printf '{\n  "version": "%s",\n  "apkUrl": "https://github.com/%s/releases/latest/download/navy-ay.apk",\n  "apkSizeBytes": %s,\n  "publishedAt": "%s"\n}\n' \
              "$VERSION" "$GITHUB_REPOSITORY" "$SIZE" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$FILE"
            git add -f "$FILE"
            git commit -m "chore: NAVY ay Android app $VERSION published"
            if git push origin "$DEPLOY_BRANCH"; then exit 0; fi
            echo "Push rejected, retrying ($attempt)"
            sleep 5
          done
          exit 1
