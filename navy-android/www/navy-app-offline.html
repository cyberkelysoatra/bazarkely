<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>NAVY ay - Pas de réseau</title>
  <!--
    Local fallback page of the NAVY ay Android app (capacitor.config.json server.errorPath).
    Shown only when the very first load of https://1sakely.org/navy fails (no network).
    Afterwards the site's Service Worker serves the app offline as usual.
    This page has no access to Capacitor plugins: it only probes the network and reloads.
  -->
  <style>
    :root { --yellow: #E9B824; --charcoal: #4A4A4A; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #FFFFFF; color: var(--charcoal);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .bar { height: 6px; background: var(--yellow); }
    main { min-height: calc(100% - 6px); display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 24px 16px; text-align: center; }
    svg { width: 112px; height: 112px; }
    h1 { font-size: 1.35rem; line-height: 1.3; margin: 24px 0 8px; max-width: 22rem; }
    p { margin: 0; font-size: 1rem; line-height: 1.5; color: rgba(74, 74, 74, 0.85); max-width: 22rem; }
    button { margin-top: 28px; min-height: 48px; padding: 12px 28px; border: 0; border-radius: 12px;
      background: var(--charcoal); color: #FFFFFF; font-size: 1rem; font-weight: 600; }
    button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
    .status { margin-top: 16px; font-size: 0.875rem; min-height: 1.25rem; }
  </style>
</head>
<body>
  <div class="bar" aria-hidden="true"></div>
  <main>
    <svg viewBox="140 240 750 530" aria-hidden="true">
      <circle cx="272" cy="637.6" r="120" fill="#E9B824"/>
      <circle cx="752" cy="637.6" r="120" fill="#4A4A4A"/>
      <path d="M292.8 519.4 A220 220 0 0 1 711.4 417.3" fill="none" stroke="#4A4A4A" stroke-width="46" stroke-linecap="round"/>
      <polygon points="648.6,429.5 731.2,519.4 774.3,405.2" fill="#4A4A4A"/>
    </svg>
    <h1>Pas de réseau.</h1>
    <p>NAVY ay se relancera dès que la connexion revient.</p>
    <button type="button" id="retry">Réessayer</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    (function () {
      var APP_URL = 'https://1sakely.org/navy';
      var PROBE_URL = 'https://1sakely.org/navy/app/version.json';
      var busy = false;
      var statusEl = document.getElementById('status');

      function probe(manual) {
        if (busy) return;
        busy = true;
        if (manual) statusEl.textContent = 'Vérification…';
        // This page is served locally by the app (another origin than 1sakely.org):
        // no-cors gives an opaque answer, enough to know the site is reachable again.
        fetch(PROBE_URL + '?t=' + Date.now(), { cache: 'no-store', mode: 'no-cors' })
          .then(function () {
            statusEl.textContent = 'Connexion retrouvée…';
            window.location.replace(APP_URL);
          })
          .catch(function () {
            if (manual) statusEl.textContent = 'Toujours pas de réseau.';
          })
          .then(function () { busy = false; });
      }

      document.getElementById('retry').addEventListener('click', function () { probe(true); });
      window.addEventListener('online', function () { probe(false); });
      setInterval(function () { probe(false); }, 5000);
    })();
  </script>
</body>
</html>
